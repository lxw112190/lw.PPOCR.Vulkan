name: Host ASan + UBSan + staged Vulkan recovery
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VULKAN_SDK: ${{ github.workspace }}/.ci/vulkan-sdk/1.4.350.0/x86_64
      LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/vulkan-sdk/1.4.350.0/x86_64/lib
      # Private, source-pinned software driver; never bundled in customer packages.
      VK_ICD_FILENAMES: ${{ github.workspace }}/.ci/mesa-lavapipe/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
      VK_LAYER_VALIDATE_SYNC: '1'
      LWVK_GPU_DET_PREPROCESS: '0'
      LWVK_GPU_TEXT_PREPROCESS: '0'
      LWVK_GPU_CROP_PREPROCESS: '0'
      LWVK_SOFTWARE_GRAPH_TIMEOUT_MS: '180000'
      ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1:strict_string_checks=1'
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-14
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
      PYTHONUTF8: '1'
      LWVK_REQUIRE_DRIVER_UNLOAD_TEST: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install host instrumentation and software Vulkan prerequisites
        run: |
          sudo apt-get update
          # Jammy ships compiler-rt in libclang-common-14-dev, not libclang-rt-14-dev.
          sudo apt-get install -y clang-14 llvm-14 libclang-common-14-dev ninja-build pkg-config binutils libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          sudo apt-get install -y gcc g++ llvm-15-dev libdrm-dev libexpat1-dev libelf-dev libzstd-dev zlib1g-dev bison flex patch
          python -m pip install -r requirements-dev.txt
          # Mesa 23.2.1 imports distutils; Python 3.12 needs setuptools' copy.
          python -m pip install meson==1.3.2 Mako==1.3.10 ply==3.11 setuptools==80.9.0
      - name: Fingerprint CI software-driver toolchain
        id: mesa_toolchain
        shell: bash
        run: |
          fingerprint="$(dpkg-query -W gcc g++ gcc-11 g++-11 libgcc-11-dev libstdc++-11-dev libllvm15 llvm-15-dev libc6-dev libdrm-dev libexpat1-dev libelf-dev libzstd-dev zlib1g-dev | sha256sum | awk '{print $1}')"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: .ci/mesa-lavapipe
          key: ci-lavapipe-jammy-x64-${{ steps.mesa_toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/build_ci_lavapipe.sh', 'scripts/ci/mesa-l3-cleanup.patch', '.github/workflows/sanitizers.yml') }}-v1
      - name: Build or verify cached lavapipe with CPU topology unload cleanup
        timeout-minutes: 25
        shell: bash
        run: |
          bash scripts/build_ci_lavapipe.sh "$GITHUB_WORKSPACE/.ci/mesa-lavapipe"
          mkdir -p build/reports/sanitizer
          cp .ci/mesa-lavapipe/recipe.sha256 build/reports/sanitizer/lavapipe-recipe.sha256
          cp .ci/mesa-lavapipe/files.sha256 build/reports/sanitizer/lavapipe-files.sha256
          cp "$VK_ICD_FILENAMES" build/reports/sanitizer/lavapipe-icd.json
          readelf -n .ci/mesa-lavapipe/lib/libvulkan_lvp.so > build/reports/sanitizer/lavapipe-build-id.txt
          # Exact patch-body ownership regression, no shader compilation.
          python tests/test_ci_lavapipe.py
      - name: Verify matching Clang 14 sanitizer runtimes before configure
        shell: bash
        run: |
          mkdir -p build/reports/sanitizer
          {
            clang-14 --version
            clang++-14 --version
            dpkg-query -W clang-14 llvm-14 libclang-common-14-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
            test -x "$ASAN_SYMBOLIZER_PATH"
            "$ASAN_SYMBOLIZER_PATH" --version
            # Ask the selected compiler: do not hard-code its patch-version directory.
            resource_dir="$(clang-14 -print-resource-dir)"
            printf 'Clang resource directory: %s\n' "$resource_dir"
            for runtime in asan asan_cxx ubsan_standalone lsan; do
              library="$resource_dir/lib/linux/libclang_rt.${runtime}-x86_64.a"
              if [ ! -r "$library" ]; then
                printf '::error::Missing Clang 14 sanitizer runtime: %s\n' "$library"
                exit 1
              fi
              printf 'PASS: %s\n' "$library"
            done
          } 2>&1 | tee build/reports/sanitizer/toolchain.txt
      - uses: actions/cache@v5
        id: sdk
        with:
          path: .ci/vulkan-sdk
          key: vulkan-sdk-linux-1.4.350.0-b65f068a-v1
      - name: Extract pinned official SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/vulkan-sdk
          curl --fail --location --retry 5 https://sdk.lunarg.com/sdk/download/1.4.350.0/linux/vulkansdk-linux-x86_64-1.4.350.0.tar.xz -o .ci/sdk.tar.xz
          echo 'b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2  .ci/sdk.tar.xz' | sha256sum --check
          tar -xJf .ci/sdk.tar.xz -C .ci/vulkan-sdk
      - name: Configure and instrument ALL native targets
        run: |
          test -x "$VULKAN_SDK/bin/glslc"
          pkg-config --exists vulkan
          python scripts/verify_assets.py
          python scripts/supply_chain.py
          python scripts/contracts.py --check
          python scripts/repository_preflight.py
          cmake -S . -B build/sanitize -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-14 -DCMAKE_CXX_COMPILER=clang++-14 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DLWVK_SANITIZERS=ON \
            -DLWVK_EXPERIMENTAL_COOP=OFF -DLWVK_EXPERIMENTAL_REC_LANES=OFF -DLWVK_EXPERIMENTAL_SHORT_REC=OFF
          cmake --build build/sanitize --parallel 2
      - name: Live enumeration with ordinary driver unload and leak checking
        run: build/sanitize/lw-ppocr-vulkan-probe
      - name: Host tests + instrumentation/leak tripwires (no GPU claims)
        run: ctest --test-dir build/sanitize --output-on-failure --parallel 1
      - name: Instrumented image shader probes (software Vulkan)
        timeout-minutes: 30
        shell: bash
        env:
          LWVK_GPU_DET_PREPROCESS: '1'
          LWVK_GPU_TEXT_PREPROCESS: '1'
          LWVK_GPU_CROP_PREPROCESS: '1'
        run: |
          # The loader may dlopen a driver/layer and unload it before LSan runs.
          # Fast allocation stacks in gates; bounded enumeration-only controls on failure.
          ldd build/sanitize/lwvk_det_gpu_preprocess_probe | tee build/reports/sanitizer/probe-dependencies.txt
          # Preserve the installed implicit layer manifest; Jammy's old loader
          # uses its NODEVICE_SELECT switch, not newer generic layer filters.
          cp /usr/share/vulkan/implicit_layer.d/VkLayer_MESA_device_select.json \
            build/reports/sanitizer/mesa-device-select-manifest.json
          python scripts/sanitizer_gpu_probes.py --build build/sanitize \
            --output build/reports/sanitizer/shader-probes --device 0
      - name: Install to isolated staging and inspect actual dependencies
        run: |
          cmake --install build/sanitize --prefix build/sanitize/staging
          python tests/test_abi_exports.py --library build/sanitize/staging/liblw.PPOCR.Vulkan.so
          # Test helper is not installed in customer release packages.
          cp build/sanitize/lwvk_api_native build/sanitize/staging/lwvk-api-native
          ldd build/sanitize/staging/lw-ppocr-vulkan-http-service
          if ldd build/sanitize/staging/lw-ppocr-vulkan-http-service | grep -q 'not found'; then exit 1; fi
          actual="$(ldd build/sanitize/staging/lwvk-api-native | awk '/liblw.PPOCR.Vulkan.so =>/ {print $3}')"
          test "$(realpath "$actual")" = "$(realpath build/sanitize/staging/liblw.PPOCR.Vulkan.so)"
      - name: Native C ABI + Tiny software Vulkan short changing-size soak
        run: build/sanitize/staging/lwvk-api-native --package build/sanitize/staging 0 32
      - name: Installed HTTP/config/errors/auth/overload/recovery + bounded hostile corpus
        run: |
          python tests/test_http.py --package build/sanitize/staging --output build/reports/sanitizer/http --device 0
          python tests/test_http_invalid.py --package build/sanitize/staging --output build/reports/sanitizer/invalid --device 0 --iterations 200
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: host-sanitizer-diagnostics-not-a-release-package
          retention-days: 3
          path: |
            build/sanitize/Testing/Temporary/**
            build/sanitize/compile_commands.json
            build/reports/sanitizer/**
          if-no-files-found: warn
