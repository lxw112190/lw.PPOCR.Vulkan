name: Linux software Vulkan full validation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  linux-software-vulkan:
    name: Full software Vulkan reference and package validation
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VULKAN_SDK: ${{ github.workspace }}/.ci/vulkan-sdk/1.4.350.0/x86_64
      LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/vulkan-sdk/1.4.350.0/x86_64/lib
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
      VK_LAYER_VALIDATE_SYNC: '1'
      # lavapipe is CPU execution, not a hardware GPU. Full reference tests use
      # per-line graph submissions: an 8-line REC GPU batch can exceed a single
      # 30-second fence budget on a shared runner. Test GPU image shaders below
      # in isolation instead of skipping their coverage. Medium single graphs
      # also need a longer finite wait on this software device (GPU stays 30s).
      LWVK_GPU_DET_PREPROCESS: '0'
      LWVK_GPU_TEXT_PREPROCESS: '0'
      LWVK_GPU_CROP_PREPROCESS: '0'
      LWVK_SOFTWARE_GRAPH_TIMEOUT_MS: '180000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Software Vulkan and validation prerequisites
        run: |
          sudo apt-get update
          # libvulkan1 is runtime-only; FindVulkan needs the libvulkan.so
          # linker file and pkg-config metadata supplied by libvulkan-dev.
          sudo apt-get install -y ninja-build pkg-config binutils libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        id: sdk
        with:
          path: .ci/vulkan-sdk
          key: vulkan-sdk-linux-1.4.350.0-b65f068a-v1
      - name: Extract pinned official SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/vulkan-sdk
          curl --fail --location --retry 5 https://sdk.lunarg.com/sdk/download/1.4.350.0/linux/vulkansdk-linux-x86_64-1.4.350.0.tar.xz -o .ci/sdk.tar.xz
          echo 'b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2  .ci/sdk.tar.xz' | sha256sum --check
          tar -xJf .ci/sdk.tar.xz -C .ci/vulkan-sdk
      - name: Verify / build / ABI tests
        run: |
          test -x "$VULKAN_SDK/bin/glslc"
          pkg-config --exists vulkan
          vulkan_libdir="$(pkg-config --variable=libdir vulkan)"
          test -n "$vulkan_libdir"
          test -r "$vulkan_libdir/libvulkan.so"
          printf 'System Vulkan loader link library: %s/libvulkan.so\n' "$vulkan_libdir"
          python scripts/verify_assets.py
          python scripts/supply_chain.py --report build/reports/supply-chain.json
          python scripts/repository_preflight.py
          python tests/test_repository_preflight.py
          python scripts/contracts.py --check
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DLWVK_EXPERIMENTAL_COOP=OFF -DLWVK_EXPERIMENTAL_REC_LANES=OFF -DLWVK_EXPERIMENTAL_SHORT_REC=OFF
          cmake --build build/ci --parallel 4
          ctest --test-dir build/ci --output-on-failure
      - name: GPU image shaders / exact bits / stride / recovery (software Vulkan)
        env:
          LWVK_GPU_DET_PREPROCESS: '1'
          LWVK_GPU_TEXT_PREPROCESS: '1'
          LWVK_GPU_CROP_PREPROCESS: '1'
        run: |
          ./build/ci/lwvk_det_gpu_preprocess_probe 0
          ./build/ci/lwvk_text_gpu_preprocess_probe 0
          ./build/ci/lwvk_gpu_crop_probe 0
          ./build/ci/lwvk_vocab_pointwise_probe 0
          ./build/ci/lwvk_short_pointwise_probe 0 --quick
      - name: Tiny DET reference using software Vulkan (not GPU performance)
        run: |
          ./build/ci/lw-ppocr-vulkan-probe
          python tests/test_det_reference.py --library build/ci/liblw.PPOCR.Vulkan.so --quick --iterations 20 --report build/reports/linux-software-det.json
          python tests/test_invalid_models.py --library build/ci/liblw.PPOCR.Vulkan.so
      - name: CLS / REC / native CTC and BGR reference (software Vulkan)
        run: |
          python tests/test_text_reference.py --library build/ci/liblw.PPOCR.Vulkan.so --quick --iterations 10 --report build/reports/linux-software-text.json
      - name: Full OCR / DB / crops / resource limits (software Vulkan, CPU image preprocessing)
        run: |
          python tests/test_ocr_reference.py --library build/ci/liblw.PPOCR.Vulkan.so --geometry build/ci/liblwvk_geometry_reference.so --quick --extended --iterations 2 --report build/reports/linux-software-full.json
      - name: Stage / installed ABI
        run: |
          cmake --install build/ci --prefix dist/staging
          python tests/test_abi_exports.py --library dist/staging/liblw.PPOCR.Vulkan.so
          python tests/test_api.py --library dist/staging/liblw.PPOCR.Vulkan.so
      - name: Installed legacy Tiny reference
        run: |
          python tests/test_det_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --model dist/staging/models/ppocrv6-tiny/det.json --quick --iterations 2
          python tests/test_text_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --model-root dist/staging/models/ppocrv6-tiny --quick --iterations 2
          python tests/test_ocr_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --geometry build/ci/liblwvk_geometry_reference.so --models dist/staging/models/ppocrv6-tiny --quick --iterations 1
      - name: Installed HTTP inference / config / authentication / recovery
        run: python tests/test_http.py --package dist/staging --output build/reports/http-software --device 0
      - name: Installed PP-OCRv6 tiny reference
        run: |
          python tests/test_text_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --model-root dist/staging/models/onnx/ppocrv6-tiny --quick --iterations 1 --report build/reports/onnx-tiny-text.json
          python tests/test_ocr_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --geometry build/ci/liblwvk_geometry_reference.so --models dist/staging/models/onnx/ppocrv6-tiny --quick --iterations 1 --report build/reports/onnx-tiny-full.json
      - name: Installed PP-OCRv6 small reference
        run: |
          python tests/test_text_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --model-root dist/staging/models/onnx/ppocrv6-small --quick --iterations 1 --report build/reports/onnx-small-text.json
          python tests/test_ocr_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --geometry build/ci/liblwvk_geometry_reference.so --models dist/staging/models/onnx/ppocrv6-small --quick --iterations 1 --report build/reports/onnx-small-full.json
      - name: Installed PP-OCRv6 medium reference
        run: |
          python tests/test_text_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --model-root dist/staging/models/onnx/ppocrv6-medium --quick --iterations 1 --report build/reports/onnx-medium-text.json
          python tests/test_ocr_reference.py --library dist/staging/liblw.PPOCR.Vulkan.so --geometry build/ci/liblwvk_geometry_reference.so --models dist/staging/models/onnx/ppocrv6-medium --quick --iterations 1 --report build/reports/onnx-medium-full.json
      - name: Service unit / package / archive verification
        run: |
          dist/staging/install-service.sh --verify-only
          python scripts/package.py --staging dist/staging --output dist --platform linux-x64
          for archive in dist/*.tar.gz; do
            python scripts/verify_archive.py --archive "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-software-validated-full-ocr
          path: |
            dist/*.tar.gz
            dist/*.sha256
            build/reports/*.json
            build/reports/http-software/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-software-vulkan-validation-diagnostics
          path: |
            build/ci/Testing/Temporary/**
            build/reports/**
          if-no-files-found: warn
