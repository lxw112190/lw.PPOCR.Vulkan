name: Vulkan build and host contracts
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing tag to rebuild/upload, e.g. v1.0.0; empty = build only'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Check release tag matches the checked-out version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: python
        run: |
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag), 'Expected vMAJOR.MINOR.PATCH[-prerelease]'
          assert Path('RELEASE_VERSION').read_text().strip() == tag[1:], 'Tag/RELEASE_VERSION mismatch'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: .ci/downloads
          key: vulkan-sdk-windows-1.4.350.0-855b27ba-v1
      - name: Install pinned SDK (official hash checked)
        shell: pwsh
        run: ./scripts/install_vulkan_sdk.ps1
      - name: Validate dependencies and models
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.3.0 psutil==7.0.0 -r requirements-contracts.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/contracts.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/supply_chain.py --report build/reports/supply-chain.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/repository_preflight.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_repository_preflight.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build / host ABI tests
        shell: pwsh
        run: |
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DLWVK_EXPERIMENTAL_COOP=OFF -DLWVK_EXPERIMENTAL_REC_LANES=OFF -DLWVK_EXPERIMENTAL_SHORT_REC=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/ci --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/ci -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/ci/Release/lw-ppocr-vulkan-probe.exe --allow-no-device
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage and package (no hardware inference claim)
        shell: pwsh
        run: |
          cmake --install build/ci --config Release --prefix dist/staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_abi_exports.py --library dist/staging/lw.PPOCR.Vulkan.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_api.py --library dist/staging/lw.PPOCR.Vulkan.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_winforms.py --package dist/staging --output build/reports/winforms --host-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_http_host.py --service dist/staging/lw-ppocr-vulkan-http-service.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package.py --staging dist/staging --output dist --platform windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/*.zip | ForEach-Object {
            python scripts/verify_archive.py --archive $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64-full-ocr
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: windows-host-diagnostics-not-a-release-package
          path: build/reports/**
          if-no-files-found: error
  linux:
    name: Linux x64 build / host checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VULKAN_SDK: ${{ github.workspace }}/.ci/vulkan-sdk/1.4.350.0/x86_64
      LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/vulkan-sdk/1.4.350.0/x86_64/lib
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Check release tag matches the checked-out version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: python
        run: |
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag), 'Expected vMAJOR.MINOR.PATCH[-prerelease]'
          assert Path('RELEASE_VERSION').read_text().strip() == tag[1:], 'Tag/RELEASE_VERSION mismatch'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and host-test prerequisites (no inference)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config binutils libvulkan-dev
          python -m pip install numpy==2.2.6 Pillow==11.3.0 psutil==7.0.0 -r requirements-contracts.txt
      - uses: actions/cache@v5
        id: sdk
        with:
          path: .ci/vulkan-sdk
          key: vulkan-sdk-linux-1.4.350.0-b65f068a-v1
      - name: Extract pinned official SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/vulkan-sdk
          curl --fail --location --retry 5 https://sdk.lunarg.com/sdk/download/1.4.350.0/linux/vulkansdk-linux-x86_64-1.4.350.0.tar.xz -o .ci/sdk.tar.xz
          echo 'b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2  .ci/sdk.tar.xz' | sha256sum --check
          tar -xJf .ci/sdk.tar.xz -C .ci/vulkan-sdk
      - name: Verify / build / host ABI tests
        run: |
          test -x "$VULKAN_SDK/bin/glslc"
          pkg-config --exists vulkan
          vulkan_libdir="$(pkg-config --variable=libdir vulkan)"
          test -n "$vulkan_libdir"
          test -r "$vulkan_libdir/libvulkan.so"
          printf 'System Vulkan loader link library: %s/libvulkan.so\n' "$vulkan_libdir"
          python scripts/contracts.py --check
          python scripts/verify_assets.py
          python scripts/supply_chain.py --report build/reports/supply-chain.json
          python scripts/repository_preflight.py
          python tests/test_repository_preflight.py
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DLWVK_EXPERIMENTAL_COOP=OFF -DLWVK_EXPERIMENTAL_REC_LANES=OFF -DLWVK_EXPERIMENTAL_SHORT_REC=OFF
          cmake --build build/ci --parallel 4
          ctest --test-dir build/ci --output-on-failure
          ./build/ci/lw-ppocr-vulkan-probe --allow-no-device
      - name: Stage and host checks (no inference claim)
        run: |
          cmake --install build/ci --prefix dist/staging
          python tests/test_abi_exports.py --library dist/staging/liblw.PPOCR.Vulkan.so
          python tests/test_api.py --library dist/staging/liblw.PPOCR.Vulkan.so
          python tests/test_http_host.py --service dist/staging/lw-ppocr-vulkan-http-service
          # Check the installed program, not just its build-tree RPATH.
          for binary in dist/staging/liblw.PPOCR.Vulkan.so dist/staging/lw-ppocr-vulkan-probe dist/staging/lw-ppocr-vulkan-http-service; do
            dependencies="$(ldd "$binary")"
            printf '%s\n' "$dependencies"
            if printf '%s\n' "$dependencies" | grep -q 'not found'; then exit 1; fi
          done
          dist/staging/install-service.sh --verify-only
      - name: Package and verify archive
        run: |
          python scripts/package.py --staging dist/staging --output dist --platform linux-x64
          for archive in dist/*.tar.gz; do
            python scripts/verify_archive.py --archive "$archive"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-full-ocr
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: linux-host-diagnostics-not-a-release-package
          path: build/reports/**
          if-no-files-found: error
  release_assets:
    name: Upload verified deployment packages to Release
    needs: [windows, linux]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      # Use upload tooling from this workflow revision. A historical tag may
      # predate these scripts; build jobs above still build that exact tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: windows-x64-full-ocr
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: linux-x64-full-ocr
          path: release-assets
      - name: Verify assets, preserve existing files, upload missing attachments
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python tests/test_release_assets.py
          python scripts/upload_release_assets.py --directory release-assets \
            --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY"
