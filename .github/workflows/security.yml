name: Source supply chain audit
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-contracts.txt
          python scripts/verify_assets.py
          python scripts/supply_chain.py --report build/reports/supply-chain.json
          python tests/test_supply_chain.py
          python scripts/contracts.py --check
          python scripts/repository_preflight.py
          python tests/test_repository_preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-sbom-and-supply-chain-audit
          path: |
            SBOM.cdx.json
            build/reports/supply-chain.json
          if-no-files-found: error
